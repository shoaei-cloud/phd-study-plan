<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامه جامع دکتری حقوق بین‌الملل ۱۴۰۵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
    textarea { resize: vertical; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">
  <header class="bg-slate-900 text-white p-5 border-b border-slate-700 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-amber-400">داشبورد دکتری حقوق تجارت و سرمایه‌گذاری بین‌المللی</h1>
        <p class="text-sm text-slate-300 mt-1">بازه هدف: شنبه ۱۵ شهریور ۱۴۰۵ تا جمعه ۱۶ بهمن ۱۴۰۵ (روز آزمون)</p>
      </div>
      <div class="flex gap-2">
        <button onclick="exportData()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-sm font-medium transition">پشتیبان‌گیری (JSON)</button>
        <label class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm font-medium cursor-pointer transition">
          بازیابی فایل
          <input type="file" id="importInput" onchange="importData(event)" class="hidden">
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">انتخاب ماه:</label>
        <select id="monthSelect" onchange="changeMonth()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-medium focus:ring-2 focus:ring-amber-400 outline-none"></select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">انتخاب هفته:</label>
        <select id="weekSelect" onchange="changeWeek()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-medium focus:ring-2 focus:ring-amber-400 outline-none"></select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">انتخاب روز:</label>
        <select id="daySelect" onchange="changeDay()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-medium focus:ring-2 focus:ring-amber-400 outline-none"></select>
      </div>
    </div>

    <!-- بخش ماه -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-800 text-white px-5 py-3 flex justify-between items-center">
        <h2 id="monthTitle" class="font-bold">اهداف ماهانه</h2>
        <span class="text-xs bg-slate-700 px-2.5 py-1 rounded">ظرفیت: ۲۰ خط برنامه</span>
      </div>
      <div class="p-5">
        <textarea id="monthText" rows="6" oninput="saveContent('month')" placeholder="اهداف، فصول مورد مطالعه و برنامه‌ریزی ماهانه (۲۰ خط)..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none leading-relaxed"></textarea>
      </div>
    </section>

    <!-- بخش هفته -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-indigo-900 text-white px-5 py-3 flex justify-between items-center">
        <h2 id="weekTitle" class="font-bold">اهداف هفتگی</h2>
        <span class="text-xs bg-indigo-800 px-2.5 py-1 rounded">ظرفیت: ۱۰ خط برنامه</span>
      </div>
      <div class="p-5">
        <textarea id="weekText" rows="4" oninput="saveContent('week')" placeholder="اهداف هفتگی، آزمون‌های آزمایشی و تست‌زنی (۱۰ خط)..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none leading-relaxed"></textarea>
      </div>
    </section>

    <!-- بخش روزانه و ۲۴ ساعت -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-amber-600 text-white px-5 py-3 flex justify-between items-center">
        <h2 id="dayTitle" class="font-bold">برنامه روزانه</h2>
        <span class="text-xs bg-amber-700 px-2.5 py-1 rounded">۳ خط کل روز + تفکیک ۲۴ ساعته</span>
      </div>
      <div class="p-5 space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">یادداشت و اهداف اصلی کل این روز (۳ خط):</label>
          <textarea id="daySummaryText" rows="3" oninput="saveContent('daySummary')" placeholder="خلاصه بازدهی و اولویت‌های این روز..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-400 outline-none leading-relaxed"></textarea>
        </div>

        <div>
          <h3 class="text-sm font-bold text-slate-700 mb-3 border-b pb-2">تفکیک برنامه ساعتی (۲۴ ساعت):</h3>
          <div id="hourlyGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const months = [
      { id: 'm1', name: 'شهریور ۱۴۰۵', days: 17, startDayName: 'شنبه', offset: 15 },
      { id: 'm2', name: 'مهر ۱۴۰۵', days: 30, startDayName: 'سه‌شنبه', offset: 1 },
      { id: 'm3', name: 'آبان ۱۴۰۵', days: 30, startDayName: 'پنج‌شنبه', offset: 1 },
      { id: 'm4', name: 'آذر ۱۴۰۵', days: 30, startDayName: 'شنبه', offset: 1 },
      { id: 'm5', name: 'دی ۱۴۰۵', days: 30, startDayName: 'دوشنبه', offset: 1 },
      { id: 'm6', name: 'بهمن ۱۴۰۵ (تا ۱۶ام)', days: 16, startDayName: 'چهارشنبه', offset: 1 }
    ];

    const weekDays = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه'];

    let allDays = [];
    let currentDayIndex = 0;

    function initCalendar() {
      let globalDayId = 1;
      let dayNameCursor = 0; // شنبه ۱۵ شهریور

      months.forEach((m, mIdx) => {
        for (let d = 0; d < m.days; d++) {
          const dayNum = m.offset + d;
          const dayName = weekDays[dayNameCursor % 7];
          const weekNum = Math.floor((globalDayId - 1) / 7) + 1;

          allDays.push({
            id: `d_${m.id}_${dayNum}`,
            monthId: m.id,
            monthName: m.name,
            dayNum: dayNum,
            dayName: dayName,
            weekId: `w_${weekNum}`,
            title: `${dayName} ${dayNum} ${m.name}`
          });

          dayNameCursor++;
          globalDayId++;
        }
      });

      renderSelectors();
      renderHourlyInputs();
      loadActiveViews();
    }

    function renderSelectors() {
      const mSel = document.getElementById('monthSelect');
      mSel.innerHTML = months.map(m => `<option value="${m.id}">${m.name}</option>`).join('');

      const totalWeeks = Math.ceil(allDays.length / 7);
      const wSel = document.getElementById('weekSelect');
      let wHtml = '';
      for (let i = 1; i <= totalWeeks; i++) {
        wHtml += `<option value="w_${i}">هفته ${i}</option>`;
      }
      wSel.innerHTML = wHtml;

      updateDaySelect();
    }

    function updateDaySelect() {
      const dSel = document.getElementById('daySelect');
      dSel.innerHTML = allDays.map((d, idx) => `<option value="${idx}">${d.title}</option>`).join('');
      dSel.value = currentDayIndex;
    }

    function renderHourlyInputs() {
      const grid = document.getElementById('hourlyGrid');
      let html = '';
      for (let h = 0; h < 24; h++) {
        const timeLabel = `${String(h).padStart(2, '0')}:00 تا ${String((h + 1) % 24).padStart(2, '0')}:00`;
        html += `
          <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200">
            <span class="text-xs font-mono font-bold text-slate-500 w-24">${timeLabel}</span>
            <input type="text" id="h_${h}" oninput="saveHour(${h})" placeholder="برنامه این ساعت..." class="w-full text-xs p-1.5 bg-white border border-slate-300 rounded outline-none focus:border-amber-500">
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    function changeDay() {
      currentDayIndex = parseInt(document.getElementById('daySelect').value);
      const cur = allDays[currentDayIndex];
      document.getElementById('monthSelect').value = cur.monthId;
      document.getElementById('weekSelect').value = cur.weekId;
      loadActiveViews();
    }

    function changeMonth() {
      const selectedMonth = document.getElementById('monthSelect').value;
      const targetIdx = allDays.findIndex(d => d.monthId === selectedMonth);
      if (targetIdx !== -1) {
        currentDayIndex = targetIdx;
        document.getElementById('daySelect').value = currentDayIndex;
        document.getElementById('weekSelect').value = allDays[targetIdx].weekId;
        loadActiveViews();
      }
    }

    function changeWeek() {
      const selectedWeek = document.getElementById('weekSelect').value;
      const targetIdx = allDays.findIndex(d => d.weekId === selectedWeek);
      if (targetIdx !== -1) {
        currentDayIndex = targetIdx;
        document.getElementById('daySelect').value = currentDayIndex;
        document.getElementById('monthSelect').value = allDays[targetIdx].monthId;
        loadActiveViews();
      }
    }

    function loadActiveViews() {
      const cur = allDays[currentDayIndex];
      document.getElementById('monthTitle').innerText = `برنامه ماهانه: ${cur.monthName}`;
      document.getElementById('weekTitle').innerText = `برنامه هفتگی: ${document.getElementById('weekSelect').options[document.getElementById('weekSelect').selectedIndex].text}`;
      document.getElementById('dayTitle').innerText = `برنامه روز: ${cur.title}`;

      document.getElementById('monthText').value = localStorage.getItem(`note_m_${cur.monthId}`) || '';
      document.getElementById('weekText').value = localStorage.getItem(`note_w_${cur.weekId}`) || '';
      document.getElementById('daySummaryText').value = localStorage.getItem(`note_d_sum_${cur.id}`) || '';

      for (let h = 0; h < 24; h++) {
        document.getElementById(`h_${h}`).value = localStorage.getItem(`note_h_${cur.id}_${h}`) || '';
      }
    }

    function saveContent(type) {
      const cur = allDays[currentDayIndex];
      if (type === 'month') localStorage.setItem(`note_m_${cur.monthId}`, document.getElementById('monthText').value);
      if (type === 'week') localStorage.setItem(`note_w_${cur.weekId}`, document.getElementById('weekText').value);
      if (type === 'daySummary') localStorage.setItem(`note_d_sum_${cur.id}`, document.getElementById('daySummaryText').value);
    }

    function saveHour(h) {
      const cur = allDays[currentDayIndex];
      localStorage.setItem(`note_h_${cur.id}_${h}`, document.getElementById(`h_${h}`).value);
    }

    function exportData() {
      const dump = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('note_')) dump[k] = localStorage.getItem(k);
      }
      const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `phd_study_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          Object.keys(data).forEach(k => localStorage.setItem(k, data[k]));
          loadActiveViews();
          alert('اطلاعات با موفقیت بازیابی شد.');
        } catch {
          alert('فایل پشتیبان معتبر نیست.');
        }
      };
      reader.readAsText(file);
    }

    initCalendar();
  </script>
</body>
</html>
